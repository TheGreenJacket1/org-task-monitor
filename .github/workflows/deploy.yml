name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Unit Tests & Typecheck
        run: |
          npm run typecheck
          npm test

      - name: Verify Supabase secrets
        run: |
          if [ -z "$VITE_SUPABASE_URL" ]; then
            echo "VITE_SUPABASE_URL kosong. Set di GitHub Secrets."; exit 1
          fi
          if [ -z "$VITE_SUPABASE_ANON_KEY" ]; then
            echo "VITE_SUPABASE_ANON_KEY kosong. Set di GitHub Secrets."; exit 1
          fi
          if echo "$VITE_SUPABASE_URL" | grep -q "xyzprojectid"; then
            echo "VITE_SUPABASE_URL masih placeholder. Ganti dengan URL project Supabase yang benar."; exit 1
          fi
          echo "Panjang VITE_SUPABASE_URL: ${#VITE_SUPABASE_URL}"
          echo "Panjang VITE_SUPABASE_ANON_KEY: ${#VITE_SUPABASE_ANON_KEY}"
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Build Application
        run: npm run build
        env:
          VITE_BASE_PATH: '/org-task-monitor/'
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify build output
        run: |
          test -f dist/index.html
          if grep -q "src/main.tsx" dist/index.html; then
            echo "Build output masih mereferensikan source TypeScript mentah"; exit 1
          fi
          test -d dist/assets

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
